name: CloudStore CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# 🔥 Lägg till detta för att fixa Node.js 20-varningen
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Make Maven wrappers executable
        run: |
          chmod +x product-service/mvnw
          chmod +x user-order-service/mvnw

      - name: Test product-service
        working-directory: product-service
        run: ./mvnw test

      - name: Test user-order-service
        working-directory: user-order-service
        run: ./mvnw test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 🔐 LOGIN STEP - KOPIERA EXAKT
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push product-service
        uses: docker/build-push-action@v5
        with:
          context: ./product-service
          file: ./product-service/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudstore-product-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudstore-product-service:${{ github.sha }}

      - name: Build and push user-order-service
        uses: docker/build-push-action@v5
        with:
          context: ./user-order-service
          file: ./user-order-service/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudstore-user-order-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudstore-user-order-service:${{ github.sha }}
            - name: Debug secrets loading
 
