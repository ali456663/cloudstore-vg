name: CloudStore CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Test product-service
        working-directory: product-service
        run: ./mvnw test

      - name: Test user-order-service
        working-directory: user-order-service
        run: ./mvnw test

      - name: Build product-service Docker image
        run: docker build -t cloudstore-product-service ./product-service

      - name: Build user-order-service Docker image
        run: docker build -t cloudstore-user-order-service ./user-order-service
